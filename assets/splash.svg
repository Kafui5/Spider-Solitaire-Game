<svg xmlns="http://www.w3.org/2000/svg" width="1284" height="2778" viewBox="0 0 1284 2778">
  <!-- Splash screen: Centered gold spade mark on dark green -->
  <defs>
    <linearGradient id="splashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D3B2E"/>
      <stop offset="50%" style="stop-color:#071D18"/>
      <stop offset="100%" style="stop-color:#071D18"/>
    </linearGradient>
    <linearGradient id="splashGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F3D58F"/>
      <stop offset="50%" style="stop-color:#E6B95C"/>
      <stop offset="100%" style="stop-color:#C69A3A"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1284" height="2778" fill="url(#splashBg)"/>
  
  <!-- Subtle web pattern -->
  <g stroke="#E6B95C" stroke-width="0.5" opacity="0.06" fill="none">
    <circle cx="642" cy="1200" r="200"/>
    <circle cx="642" cy="1200" r="350"/>
    <circle cx="642" cy="1200" r="500"/>
    <circle cx="642" cy="1200" r="650"/>
    <line x1="642" y1="550" x2="642" y2="1850"/>
    <line x1="192" y1="1200" x2="1092" y2="1200"/>
    <line x1="342" y1="750" x2="942" y2="1650"/>
    <line x1="942" y1="750" x2="342" y2="1650"/>
  </g>
  
  <!-- Kente color band -->
  <rect x="0" y="800" width="257" height="4" fill="#E6B95C"/>
  <rect x="257" y="800" width="257" height="4" fill="#C96842"/>
  <rect x="514" y="800" width="257" height="4" fill="#293261"/>
  <rect x="771" y="800" width="257" height="4" fill="#E6B95C"/>
  <rect x="1028" y="800" width="256" height="4" fill="#C96842"/>
  
  <!-- Central gold circle with spade -->
  <circle cx="642" cy="1200" r="120" fill="url(#splashGold)"/>
  <g transform="translate(642, 1195)">
    <path d="M0,-55 
             C-5,-55 -42,-30 -42,8 
             C-42,33 -22,46 0,36 
             C22,46 42,33 42,8 
             C42,-30 5,-55 0,-55 Z" 
          fill="#071D18"/>
    <rect x="-6" y="26" width="12" height="32" rx="3" fill="#071D18"/>
    <ellipse cx="0" cy="58" rx="15" ry="5" fill="#071D18"/>
  </g>
  
  <!-- Title -->
  <text x="642" y="1420" font-family="sans-serif" font-size="56" font-weight="900" 
        fill="#FFF8E9" text-anchor="middle" letter-spacing="3">
    Silk Spider
  </text>
  <text x="642" y="1480" font-family="sans-serif" font-size="24" font-weight="600" 
        fill="#AFC8BE" text-anchor="middle" letter-spacing="10" text-transform="uppercase">
    SOLITAIRE
  </text>
  
  <!-- Bottom tagline -->
  <text x="642" y="2400" font-family="sans-serif" font-size="16" font-weight="600" 
        fill="#AFC8BE" text-anchor="middle" letter-spacing="3" opacity="0.6">
    A CLASSIC, REWOVEN
  </text>
</svg>
