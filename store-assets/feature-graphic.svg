<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <!-- Play Store Feature Graphic: 1024×500 -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D3B2E"/>
      <stop offset="100%" style="stop-color:#071D18"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F3D58F"/>
      <stop offset="50%" style="stop-color:#E6B95C"/>
      <stop offset="100%" style="stop-color:#C69A3A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bgGrad)"/>

  <!-- Subtle web pattern -->
  <g stroke="#E6B95C" stroke-width="0.5" opacity="0.08" fill="none">
    <circle cx="200" cy="250" r="80"/>
    <circle cx="200" cy="250" r="140"/>
    <circle cx="200" cy="250" r="200"/>
    <circle cx="200" cy="250" r="260"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="0" y1="250" x2="460" y2="250"/>
    <line x1="17" y1="67" x2="383" y2="433"/>
    <line x1="383" y1="67" x2="17" y2="433"/>
  </g>

  <!-- Kente strip top -->
  <rect x="0" y="0" width="205" height="5" fill="#E6B95C"/>
  <rect x="205" y="0" width="205" height="5" fill="#C96842"/>
  <rect x="410" y="0" width="204" height="5" fill="#293261"/>
  <rect x="614" y="0" width="205" height="5" fill="#E6B95C"/>
  <rect x="819" y="0" width="205" height="5" fill="#C96842"/>

  <!-- Kente strip bottom -->
  <rect x="0" y="495" width="205" height="5" fill="#C96842"/>
  <rect x="205" y="495" width="205" height="5" fill="#E6B95C"/>
  <rect x="410" y="495" width="204" height="5" fill="#293261"/>
  <rect x="614" y="495" width="205" height="5" fill="#E6B95C"/>
  <rect x="819" y="495" width="205" height="5" fill="#C96842"/>

  <!-- Gold spade icon (left area) -->
  <g transform="translate(200, 230)">
    <path d="M0,-80
             C-7,-80 -60,-44 -60,10
             C-60,46 -32,65 0,50
             C32,65 60,46 60,10
             C60,-44 7,-80 0,-80 Z"
          fill="url(#goldGrad)"/>
    <rect x="-9" y="36" width="18" height="44" rx="4" fill="url(#goldGrad)"/>
    <ellipse cx="0" cy="80" rx="22" ry="8" fill="url(#goldGrad)"/>
  </g>

  <!-- Title text -->
  <text x="540" y="200" font-family="sans-serif" font-size="52" font-weight="900"
        fill="#FFF8E9" text-anchor="middle" letter-spacing="2">
    Silk Spider
  </text>
  <text x="540" y="255" font-family="sans-serif" font-size="28" font-weight="600"
        fill="#AFC8BE" text-anchor="middle" letter-spacing="8">
    SOLITAIRE
  </text>

  <!-- Tagline -->
  <text x="540" y="320" font-family="sans-serif" font-size="18" font-weight="400"
        fill="#E6B95C" text-anchor="middle" letter-spacing="1" opacity="0.9">
    A classic, rewoven. Beautiful. Calm. Ad-free.
  </text>

  <!-- Feature pills -->
  <g font-family="sans-serif" font-size="13" font-weight="700" fill="#FFF8E9">
    <rect x="370" y="360" width="100" height="30" rx="15" fill="#293261" opacity="0.8"/>
    <text x="420" y="380" text-anchor="middle">No Ads</text>

    <rect x="485" y="360" width="100" height="30" rx="15" fill="#293261" opacity="0.8"/>
    <text x="535" y="380" text-anchor="middle">Offline</text>

    <rect x="600" y="360" width="130" height="30" rx="15" fill="#293261" opacity="0.8"/>
    <text x="665" y="380" text-anchor="middle">Daily Challenge</text>
  </g>

  <!-- Decorative cards (right side, fanned) -->
  <g transform="translate(850, 250)" opacity="0.5">
    <rect x="-30" y="-50" width="40" height="58" rx="4" fill="#FFFDF6" stroke="#D9D3C5" transform="rotate(-15)"/>
    <rect x="-10" y="-52" width="40" height="58" rx="4" fill="#FFFDF6" stroke="#D9D3C5" transform="rotate(-5)"/>
    <rect x="10" y="-53" width="40" height="58" rx="4" fill="#FFFDF6" stroke="#D9D3C5" transform="rotate(5)"/>
    <rect x="30" y="-50" width="40" height="58" rx="4" fill="#FFFDF6" stroke="#D9D3C5" transform="rotate(15)"/>
  </g>
</svg>
